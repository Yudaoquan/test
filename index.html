<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一份轻盈、直觉化的 MBTI 性格偏好测试。" />
  <title>棱镜 · MBTI 性格测试</title>
  <style>
    :root {
      --ink: #20302b;
      --muted: #6f7c76;
      --paper: #f2efe7;
      --card: rgba(255, 253, 247, .86);
      --line: rgba(32, 48, 43, .14);
      --green: #456d5d;
      --green-dark: #2f5144;
      --coral: #e7775e;
      --yellow: #efc85a;
      --shadow: 0 24px 80px rgba(38, 57, 49, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 5% 15%, rgba(239, 200, 90, .22), transparent 26rem),
        radial-gradient(circle at 95% 90%, rgba(231, 119, 94, .15), transparent 32rem),
        var(--paper);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(231, 119, 94, .45); outline-offset: 3px; }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      z-index: 20;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
    }

    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .topbar {
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: .08em; }
    .brand-mark { width: 26px; height: 26px; position: relative; transform: rotate(45deg); }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; inset: 0; border-radius: 5px; }
    .brand-mark::before { background: var(--green); }
    .brand-mark::after { background: var(--yellow); transform: translate(7px, -7px); mix-blend-mode: multiply; }
    .top-meta { color: var(--muted); font-size: 13px; letter-spacing: .08em; }

    main { min-height: calc(100vh - 86px); }
    .screen { display: none; animation: rise .55s ease both; }
    .screen.active { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    .hero {
      min-height: calc(100vh - 86px);
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      align-items: center;
      gap: 64px;
      padding: 72px 0 88px;
    }
    .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--green); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 36px; height: 1px; background: currentColor; }
    h1, h2, h3 { font-family: "Songti SC", "STSong", "SimSun", serif; margin: 0; }
    h1 { max-width: 680px; margin-top: 24px; font-size: clamp(48px, 7vw, 88px); line-height: 1.08; letter-spacing: -.05em; font-weight: 600; }
    h1 em { color: var(--coral); font-style: normal; position: relative; white-space: nowrap; }
    h1 em::after { content: ""; position: absolute; height: 10px; left: 4px; right: -4px; bottom: 4px; background: var(--yellow); z-index: -1; opacity: .55; transform: rotate(-1deg); }
    .lead { max-width: 560px; margin: 28px 0 34px; color: var(--muted); font-size: 17px; line-height: 1.9; }
    .primary-btn {
      border: 0;
      border-radius: 999px;
      padding: 16px 22px 16px 26px;
      display: inline-flex;
      align-items: center;
      gap: 28px;
      color: white;
      background: var(--green-dark);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(47, 81, 68, .18);
      transition: transform .2s, box-shadow .2s, background .2s;
    }
    .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 28px rgba(47, 81, 68, .24); background: #26463a; }
    .primary-btn span:last-child { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.13); font-size: 18px; }
    .facts { display: flex; gap: 26px; margin-top: 26px; color: var(--muted); font-size: 12px; }
    .facts span { display: flex; gap: 7px; align-items: center; }
    .facts span::before { content: "✓"; color: var(--green); font-weight: 600; }

    .portrait { position: relative; min-height: 560px; display: grid; place-items: center; }
    .orbit { position: absolute; border: 1px solid rgba(69, 109, 93, .19); border-radius: 50%; }
    .orbit.one { width: 470px; height: 470px; animation: spin 25s linear infinite; }
    .orbit.two { width: 350px; height: 350px; animation: spin 18s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { position: absolute; width: 13px; height: 13px; border-radius: 50%; background: var(--coral); left: 44px; top: 62px; }
    .orbit.two .dot { background: var(--yellow); left: auto; right: 8px; top: 210px; width: 18px; height: 18px; }
    .face {
      width: 310px;
      height: 410px;
      position: relative;
      z-index: 2;
      border-radius: 48% 48% 44% 44% / 38% 38% 58% 58%;
      background: #ead8bd;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .face::before { content: ""; position: absolute; left: -4%; top: -5%; width: 108%; height: 48%; border-radius: 50% 50% 42% 46%; background: var(--green-dark); transform: rotate(-4deg); }
    .face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 44%, rgba(255,255,255,.35) 45%, transparent 47%); }
    .eyes { position: absolute; z-index: 2; top: 188px; left: 70px; width: 170px; display: flex; justify-content: space-between; }
    .eye { width: 28px; height: 15px; border-top: 3px solid var(--ink); border-radius: 50%; }
    .nose { position: absolute; z-index: 2; top: 210px; left: 148px; height: 60px; width: 18px; border-left: 2px solid rgba(32,48,43,.5); border-bottom: 2px solid rgba(32,48,43,.5); border-radius: 0 0 0 12px; }
    .mouth { position: absolute; z-index: 2; top: 298px; left: 127px; width: 58px; height: 22px; border-bottom: 3px solid var(--coral); border-radius: 50%; }
    .type-chip { position: absolute; z-index: 4; padding: 12px 17px; border-radius: 14px; background: var(--card); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(32,48,43,.1); font: 600 13px/1 "Segoe UI", sans-serif; }
    .type-chip.a { top: 60px; right: 4px; transform: rotate(6deg); }
    .type-chip.b { bottom: 76px; left: 2px; transform: rotate(-7deg); }
    .type-chip small { display: block; margin-top: 7px; color: var(--muted); font-weight: 400; }

    .quiz-wrap { width: min(820px, 100%); margin: 0 auto; padding: 48px 0 80px; }
    .quiz-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 45px; }
    .progress-label { color: var(--muted); font-size: 13px; }
    .progress-label strong { color: var(--ink); font-size: 24px; font-family: "Songti SC", "STSong", "SimSun", serif; }
    .progress { width: min(420px, 58vw); height: 5px; background: rgba(69,109,93,.12); border-radius: 9px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--coral); border-radius: inherit; transition: width .4s ease; }
    .question-card { padding: clamp(28px, 5vw, 58px); border: 1px solid rgba(255,255,255,.8); border-radius: 28px; background: var(--card); backdrop-filter: blur(14px); box-shadow: var(--shadow); }
    .question-index { color: var(--coral); font-size: 12px; letter-spacing: .14em; font-weight: 600; }
    .question-card h2 { margin: 16px 0 34px; font-size: clamp(26px, 4vw, 39px); line-height: 1.5; letter-spacing: -.03em; }
    .choices { display: grid; gap: 14px; }
    .choice {
      width: 100%;
      display: grid;
      grid-template-columns: 46px 1fr 28px;
      align-items: center;
      gap: 17px;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 16px 18px;
      color: var(--ink);
      background: rgba(255,255,255,.44);
      text-align: left;
      cursor: pointer;
      transition: border .2s, transform .2s, background .2s;
    }
    .choice:hover { border-color: var(--green); transform: translateX(4px); background: #fffdf7; }
    .choice-key { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: #e7ebe6; color: var(--green-dark); font-weight: 600; }
    .choice-text { line-height: 1.55; }
    .choice-arrow { color: var(--muted); font-size: 20px; }
    .quiz-foot { display: flex; justify-content: space-between; margin-top: 24px; color: var(--muted); font-size: 12px; }
    .text-btn { border: 0; background: none; color: var(--green-dark); padding: 8px 0; cursor: pointer; }
    .text-btn:disabled { opacity: .3; cursor: default; }

    .result-wrap { width: min(1000px, 100%); margin: 0 auto; padding: 58px 0 84px; }
    .result-grid { display: grid; grid-template-columns: .76fr 1.24fr; gap: 22px; }
    .result-card { background: var(--card); border: 1px solid rgba(255,255,255,.8); border-radius: 28px; box-shadow: var(--shadow); }
    .result-main { padding: 46px; position: relative; overflow: hidden; }
    .result-main::after { content: attr(data-type); position: absolute; right: -16px; bottom: -36px; font-size: 100px; font-weight: 600; letter-spacing: -.08em; color: rgba(69,109,93,.06); }
    .result-tag { color: var(--coral); font-size: 12px; letter-spacing: .14em; }
    .result-type { margin: 16px 0 7px; color: var(--green-dark); font: 600 clamp(62px, 9vw, 92px)/1 "Segoe UI", sans-serif; letter-spacing: -.07em; }
    .result-name { font-size: 25px; }
    .result-blurb { margin: 24px 0 0; color: var(--muted); line-height: 1.8; }
    .result-detail { padding: 42px; }
    .result-detail h3 { font-size: 24px; margin-bottom: 24px; }
    .dimension { margin: 19px 0; }
    .dimension-copy { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .dimension-copy b { color: var(--ink); font-weight: 600; }
    .dimension-track { height: 8px; background: #e3e6de; border-radius: 20px; overflow: hidden; }
    .dimension-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--yellow), var(--coral)); width: 50%; transition: width .8s ease .15s; }
    .traits { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
    .trait { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--green-dark); background: rgba(255,255,255,.4); }
    .result-actions { display: flex; align-items: center; gap: 20px; margin-top: 26px; }
    .disclaimer { margin: 26px 4px 0; color: var(--muted); font-size: 11px; line-height: 1.7; }

    @media (max-width: 840px) {
      .hero { grid-template-columns: 1fr; padding-top: 48px; gap: 24px; }
      .portrait { min-height: 440px; transform: scale(.84); margin: -20px 0 -50px; }
      .result-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 1180px); }
      .topbar { height: 70px; }
      .top-meta { display: none; }
      main { min-height: calc(100vh - 70px); }
      .hero { min-height: calc(100vh - 70px); padding: 42px 0 55px; }
      h1 { font-size: 45px; }
      .lead { font-size: 15px; }
      .portrait { display: none; }
      .quiz-wrap { padding-top: 28px; }
      .quiz-head { align-items: center; margin-bottom: 26px; }
      .question-card { padding: 26px 20px; border-radius: 22px; }
      .question-card h2 { font-size: 25px; margin-bottom: 26px; }
      .choice { grid-template-columns: 38px 1fr 18px; padding: 14px 12px; gap: 12px; }
      .choice-key { width: 34px; height: 34px; }
      .quiz-foot span { display: none; }
      .result-wrap { padding-top: 28px; }
      .result-main, .result-detail { padding: 28px 24px; }
      .result-actions { align-items: stretch; flex-direction: column; }
      .result-actions .primary-btn { justify-content: space-between; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>棱镜 PRISM</span></div>
      <div class="top-meta">MBTI · SELF DISCOVERY</div>
    </header>

    <main>
      <section id="intro" class="screen active" aria-labelledby="intro-title">
        <div class="hero">
          <div>
            <div class="eyebrow">不是标签，是一面镜子</div>
            <h1 id="intro-title">遇见你的<br><em>性格底色</em></h1>
            <p class="lead">12 个直觉问题，勾勒你感知世界、做出决定与连接他人的方式。跟随第一反应，没有标准答案。</p>
            <button class="primary-btn" id="startBtn"><span>开始探索</span><span aria-hidden="true">↗</span></button>
            <div class="facts"><span>约 3 分钟</span><span>结果仅保存在本机</span></div>
          </div>
          <div class="portrait" aria-hidden="true">
            <div class="orbit one"><i class="dot"></i></div>
            <div class="orbit two"><i class="dot"></i></div>
            <div class="type-chip a">INTUITION<small>关注可能性</small></div>
            <div class="type-chip b">FEELING<small>倾听价值感</small></div>
            <div class="face"><div class="eyes"><i class="eye"></i><i class="eye"></i></div><i class="nose"></i><i class="mouth"></i></div>
          </div>
        </div>
      </section>

      <section id="quiz" class="screen" aria-live="polite" aria-labelledby="questionTitle">
        <div class="quiz-wrap">
          <div class="quiz-head">
            <div class="progress-label"><strong id="currentNum">01</strong> / 12</div>
            <div class="progress" role="progressbar" aria-label="测试进度" aria-valuemin="1" aria-valuemax="12"><div id="progressFill"></div></div>
          </div>
          <article class="question-card">
            <div class="question-index" id="dimensionLabel">ENERGY · 能量来源</div>
            <h2 id="questionTitle"></h2>
            <div class="choices" id="choices"></div>
          </article>
          <div class="quiz-foot"><button class="text-btn" id="backBtn">← 上一题</button><span>凭第一感觉选择 · 可随时返回修改</span><button class="text-btn" id="exitBtn">退出测试</button></div>
        </div>
      </section>

      <section id="result" class="screen" aria-labelledby="resultType">
        <div class="result-wrap">
          <div class="result-grid">
            <article class="result-card result-main" id="resultMain" data-type="INFP">
              <div class="result-tag">YOUR PERSONALITY TYPE</div>
              <div class="result-type" id="resultType">INFP</div>
              <h2 class="result-name" id="resultName">治愈者</h2>
              <p class="result-blurb" id="resultBlurb"></p>
            </article>
            <article class="result-card result-detail">
              <h3>你的性格光谱</h3>
              <div id="dimensions"></div>
              <div class="traits" id="traits"></div>
            </article>
          </div>
          <div class="result-actions">
            <button class="primary-btn" id="restartBtn"><span>重新测试</span><span aria-hidden="true">↻</span></button>
            <button class="text-btn" id="copyBtn">复制结果摘要</button>
          </div>
          <p class="disclaimer">MBTI 反映的是当下的偏好倾向，而不是能力高低或固定标签。本测试为轻量体验版，不用于心理诊断或职业评估。</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const questions = [
      { d:'EI', label:'ENERGY · 能量来源', q:'结束忙碌的一周后，哪种安排更让你恢复电量？', a:[['E','和朋友临时约见，去热闹的新店'],['I','留出完整的独处时间，按自己的节奏放松']] },
      { d:'EI', label:'ENERGY · 能量来源', q:'进入一个几乎都是陌生人的聚会，你通常会……', a:[['E','自然开启话题，在互动中找到状态'],['I','先观察氛围，遇到投缘的人再深入聊']] },
      { d:'EI', label:'ENERGY · 能量来源', q:'有了一个有趣的新想法，你更倾向于……', a:[['E','说出来，在来回讨论中逐渐成形'],['I','先独自想清楚，再分享相对完整的版本']] },
      { d:'SN', label:'PERCEPTION · 信息感知', q:'学习一项新技能时，什么方式对你更有效？', a:[['S','从具体示范和清晰步骤开始练习'],['N','先理解整体概念，再自由探索细节']] },
      { d:'SN', label:'PERCEPTION · 信息感知', q:'朋友讲述一次旅行，你更容易记住……', a:[['S','地点、食物、路线这些真实细节'],['N','旅途带来的感受、联想和故事意义']] },
      { d:'SN', label:'PERCEPTION · 信息感知', q:'面对一个成熟但略显乏味的方案，你会……', a:[['S','优先采用，稳定可执行最重要'],['N','想试试新路径，哪怕它需要更多摸索']] },
      { d:'TF', label:'DECISION · 决策方式', q:'朋友犯错后找你倾诉，你的第一反应更接近……', a:[['T','帮他梳理原因，找到可以解决的环节'],['F','先理解他的感受，让他知道自己被接住']] },
      { d:'TF', label:'DECISION · 决策方式', q:'团队意见僵持不下时，你认为更可靠的依据是……', a:[['T','一致的原则和客观的利弊分析'],['F','每个人的处境以及决定对关系的影响']] },
      { d:'TF', label:'DECISION · 决策方式', q:'必须给出负面反馈时，你更在意……', a:[['T','表达准确直接，确保问题真正被看见'],['F','措辞温和体面，尽量减少对方的挫败感']] },
      { d:'JP', label:'LIFESTYLE · 生活方式', q:'即将开始一次长途旅行，你通常会……', a:[['J','提前安排好交通、住宿和每日重点'],['P','只定大方向，把空间留给沿途惊喜']] },
      { d:'JP', label:'LIFESTYLE · 生活方式', q:'同时有几个待办任务时，你更舒服的节奏是……', a:[['J','列出顺序，完成一个再开始下一个'],['P','在不同任务间切换，跟随当时的状态']] },
      { d:'JP', label:'LIFESTYLE · 生活方式', q:'临时变化打乱了原本的安排，你通常会觉得……', a:[['J','有些不适，需要尽快重新建立秩序'],['P','没什么，随机应变有时反而更有意思']] }
    ];

    const profiles = {
      INTJ:['建筑师','安静而坚定的长期主义者。你擅长看见系统背后的规律，并以清晰的逻辑把愿景一步步变成现实。',['独立思考','战略眼光','目标清晰','持续精进']],
      INTP:['逻辑学家','对世界永远保有好奇。你享受拆解复杂问题、验证新观点，也常在不经意间发现别人忽略的路径。',['求知欲强','逻辑敏锐','开放灵活','善于创新']],
      ENTJ:['指挥官','有远见的行动派。你天然关注效率与成长，善于整合资源，并带领团队朝一个清晰的方向前进。',['果断自信','组织有力','目标导向','擅长决策']],
      ENTP:['辩论家','聪明而灵动的探索者。新想法会点亮你，你擅长挑战惯例，也总能为问题打开意想不到的入口。',['思维敏捷','创意丰富','敢于挑战','适应力强']],
      INFJ:['提倡者','温柔而有洞察力的理想主义者。你能敏锐感知他人，也愿意为真正相信的价值投入长久而安静的努力。',['洞察人心','坚定理想','善于倾听','富有创造力']],
      INFP:['治愈者','你拥有细腻而丰盛的内在世界。真诚与意义感是你的指南针，你总能在平凡之处发现诗意与可能。',['真诚敏感','想象丰富','共情力强','重视意义']],
      ENFJ:['引路人','温暖而有感染力的同行者。你善于看见每个人的潜能，并用真诚的鼓励让彼此走向更好的方向。',['热情可靠','善于激励','富有同理心','重视连接']],
      ENFP:['追光者','热忱、自由，永远对新的可能性心动。你用好奇连接世界，也用独特的感染力点亮身边的人。',['热情灵动','好奇开放','表达真诚','创意充沛']],
      ISTJ:['检查者','可靠而沉稳的秩序守护者。你尊重事实与承诺，习惯用扎实的行动把每件事落到实处。',['认真负责','注重细节','有条不紊','值得信赖']],
      ISFJ:['守护者','细心且低调的温暖力量。你记得他人的需要，也愿意用具体而持续的行动守护重要的人与事。',['体贴周到','忠诚可靠','务实细致','耐心温和']],
      ESTJ:['管理者','务实而高效的执行者。你善于建立秩序、厘清责任，让团队在明确的规则中稳定前进。',['执行力强','坦率直接','重视规则','组织清晰']],
      ESFJ:['执政官','热心而可靠的关系连接者。你关注身边人的感受，擅长创造友善、和谐且彼此支持的氛围。',['热情友善','乐于助人','责任感强','善于合作']],
      ISTP:['鉴赏家','冷静而灵活的实践者。你喜欢亲手探索事物如何运转，并能在突发状况中迅速找到有效解法。',['冷静独立','动手能力强','灵活务实','善于应变']],
      ISFP:['探险家','敏感、自在，拥有不张扬的审美与善意。你珍惜真实体验，也乐于以自己的方式让世界更柔软。',['审美敏锐','温和包容','活在当下','尊重自由']],
      ESTP:['企业家','充满活力的现场派。你反应迅速、敢于行动，总能在变化中捕捉机会并带动周围气氛。',['行动果断','精力充沛','务实敏锐','乐于冒险']],
      ESFP:['表演者','真诚而明亮的快乐创造者。你享受当下、热爱体验，也总能让身边的人感到轻松与被欢迎。',['乐观热情','自然亲切','感知敏锐','享受生活']]
    };

    let index = 0;
    let answers = [];
    const $ = (s) => document.querySelector(s);

    function show(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.id === id));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderQuestion() {
      const item = questions[index];
      $('#currentNum').textContent = String(index + 1).padStart(2, '0');
      $('#progressFill').style.width = `${((index + 1) / questions.length) * 100}%`;
      $('.progress').setAttribute('aria-valuenow', index + 1);
      $('#dimensionLabel').textContent = item.label;
      $('#questionTitle').textContent = item.q;
      $('#choices').innerHTML = item.a.map((opt, i) => `
        <button class="choice" data-value="${opt[0]}">
          <span class="choice-key">${i === 0 ? 'A' : 'B'}</span>
          <span class="choice-text">${opt[1]}</span>
          <span class="choice-arrow" aria-hidden="true">→</span>
        </button>`).join('');
      $('#backBtn').disabled = index === 0;
      document.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', () => choose(btn.dataset.value)));
    }

    function choose(value) {
      answers[index] = value;
      if (index < questions.length - 1) {
        index++;
        renderQuestion();
      } else {
        renderResult();
        show('result');
      }
    }

    function renderResult() {
      const pairs = [['E','I'],['S','N'],['T','F'],['J','P']];
      const scores = {};
      pairs.flat().forEach(k => scores[k] = answers.filter(a => a === k).length);
      const type = pairs.map(([a,b]) => scores[a] > scores[b] ? a : b).join('');
      const [name, blurb, traits] = profiles[type];
      $('#resultType').textContent = type;
      $('#resultName').textContent = name;
      $('#resultBlurb').textContent = blurb;
      $('#resultMain').dataset.type = type;
      $('#traits').innerHTML = traits.map(t => `<span class="trait">${t}</span>`).join('');
      const dimensionNames = [['外向 E','内向 I'],['实感 S','直觉 N'],['思考 T','情感 F'],['判断 J','感知 P']];
      $('#dimensions').innerHTML = pairs.map((pair, i) => {
        const left = Math.round(scores[pair[0]] / 3 * 100);
        const right = 100 - left;
        return `<div class="dimension"><div class="dimension-copy"><span>${dimensionNames[i][0]} <b>${left}%</b></span><span><b>${right}%</b> ${dimensionNames[i][1]}</span></div><div class="dimension-track"><div class="dimension-fill" style="width:${left}%"></div></div></div>`;
      }).join('');
      localStorage.setItem('prism-mbti-result', JSON.stringify({ type, name, scores, date: new Date().toISOString() }));
    }

    $('#startBtn').addEventListener('click', () => { index = 0; answers = []; renderQuestion(); show('quiz'); });
    $('#backBtn').addEventListener('click', () => { if (index > 0) { index--; renderQuestion(); } });
    $('#exitBtn').addEventListener('click', () => show('intro'));
    $('#restartBtn').addEventListener('click', () => { index = 0; answers = []; renderQuestion(); show('quiz'); });
    $('#copyBtn').addEventListener('click', async () => {
      const text = `我的 MBTI 测试结果是 ${$('#resultType').textContent} · ${$('#resultName').textContent}。${$('#resultBlurb').textContent}`;
      try {
        await navigator.clipboard.writeText(text);
        $('#copyBtn').textContent = '已复制 ✓';
        setTimeout(() => $('#copyBtn').textContent = '复制结果摘要', 1800);
      } catch { $('#copyBtn').textContent = '复制失败，请手动复制'; }
    });
    document.addEventListener('keydown', e => {
      if (!$('#quiz').classList.contains('active')) return;
      if (e.key.toLowerCase() === 'a') document.querySelectorAll('.choice')[0]?.click();
      if (e.key.toLowerCase() === 'b') document.querySelectorAll('.choice')[1]?.click();
      if (e.key === 'ArrowLeft' && index > 0) { index--; renderQuestion(); }
    });
  </script>
</body>
</html>
